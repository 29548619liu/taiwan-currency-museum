<body>
<main class="site">
<header class="top"><div class="brand"><span class="brandmark">＄</span><span>貨幣時空博物館</span></div><div class="top-right"><span class="tag">●</span> SINGLE-PLAYER EXPERIENCE<br>1893 — 2026 · 臺灣</div></header>
<section class="frame" aria-label="像素風博物館遊戲">
<div class="game" id="game"><canvas id="world" width="480" height="270" aria-label="第三人稱像素角色與博物館場景"></canvas><div class="screen-lines"></div><button class="fullscreen-button" id="fullscreenButton" type="button" title="瀏覽器全螢幕切換">⛶ 全螢幕</button>

function perspectiveExhibit(i){
 const distance=milestones[i]-game.prog;
 if(distance < -160 || distance>1750)return;
 // At the interaction spot the artwork sits clearly on the adjacent wall,
 // while distant works become smaller and converge toward the vanishing point.
 const s=1/(1+Math.max(0,distance)/255),side=i%2?1:-1,cx=240-(game.x-240)*.2;
 const x=cx+side*188*s, y=99+20*s, w=82*s,h=90*s;
 if(!wallArt[i]){const sprite=document.createElement('canvas');artifactCanvas(sprite,i);wallArt[i]=sprite}
 ctx.save();ctx.translate(Math.round(x),Math.round(y));
 border(-w/2-5*s,-h/2-5*s,w+10*s,h+10*s,'#251c22','#836d4f',Math.max(1,Math.round(4*s)));
 border(-w/2,-h/2,w,h,'#122336','#d8b77b',Math.max(1,Math.round(3*s)));
 ctx.drawImage(wallArt[i],Math.round(-w/2+5*s),Math.round(-h/2+5*s),Math.round(w-10*s),Math.round(h-21*s));
 const band=Math.max(6,Math.round(12*s));box(-w/2+1,h/2-band,w-2,band,'#dec68b');
 if(s>.18){label('0'+(i+1)+' '+['清末','日治','戰後','新幣','現代'][i],0,h/2-band/2,Math.max(7,Math.round(9*s)),'#243246')}
 if(nearExhibitIndex()===i){ctx.strokeStyle='#fff2aa';ctx.lineWidth=3;ctx.strokeRect(-w/2-7*s,-h/2-7*s,w+14*s,h+14*s);border(-w/2-3*s,-h/2-26*s,w+6*s,21*s,'#f3d58d','#33445f',2);label('按 F 展開',0,-h/2-16*s,Math.max(9,12*s),'#17253b')}
 ctx.restore();
}
function drawHall(){
 const v=240-(game.x-240)*.2;
 // Rear-camera, one-point perspective. Vanishing point stays ahead; chicken always
 // appears in the foreground, with back facing us, as the world advances past it.
 box(0,0,480,270,'#101a2b');
 hallPolygon([[0,0],[480,0],[v,99]],'#212b43');
 hallPolygon([[0,0],[v,99],[0,270]],'#35435d');
 hallPolygon([[480,0],[v,99],[480,270]],'#2e3e58');
 hallPolygon([[0,270],[480,270],[v,99]],'#586379');
 hallPolygon([[0,0],[15,0],[v,99],[0,245]],'#27354e');
 hallPolygon([[480,0],[465,0],[v,99],[480,245]],'#25334b');
 // Base lines trace the corridor depth.
 hallStroke(0,270,v,99,'#dfb57c',4);hallStroke(480,270,v,99,'#dfb57c',4);
 hallStroke(0,0,v,99,'#68778c',3);hallStroke(480,0,v,99,'#68778c',3);
 // floor tile grout lines, fixed in world coordinates rather than painted in screen space
 const tile=85,start=Math.floor(game.prog/tile)*tile;
 for(let z=start;z<game.prog+2100;z+=tile){
   const d=z-game.prog;if(d<0)continue;
   const p=perspective(d);hallStroke(p.l,p.f,p.r,p.f,'#83889a',Math.max(.6,3*p.s));
   for(let t=-2;t<=2;t++){const xx=p.cx+(t/3)*240*p.s;hallStroke(xx,p.f,v,99,'#6c788c',Math.max(.5,1.2*p.s));}
 }
 // Vertical support strips and ceiling lamps recede continuously as player walks.
 const support=240,startSupport=Math.floor(game.prog/support)*support;
 for(let z=startSupport;z<game.prog+1950;z+=support){
   const p=perspective(z-game.prog);if(z<game.prog)continue;
   const wid=Math.max(.7,8*p.s);
   hallStroke(p.l,p.c,p.l,p.f,'#b69b75',wid);hallStroke(p.r,p.c,p.r,p.f,'#b69b75',wid);
   hallStroke(p.cx-26*p.s,p.c+13*p.s,p.cx+26*p.s,p.c+13*p.s,'#e3cd9a',Math.max(1,8*p.s));
 }
 // Frame the five works on the side walls, rendered far-to-near for correct layering.
 [4,3,2,1,0].forEach(perspectiveExhibit);
 const doorDistance=corridorEnd-game.prog;
 if(doorDistance>-10){const p=perspective(doorDistance),w=128*p.s,h=160*p.s;
   border(p.cx-w/2,99-h/2,w,h,'#19273b','#cca972',Math.max(1,Math.round(5*p.s)));
   border(p.cx-w/2+8*p.s,99-h/2+8*p.s,w-16*p.s,h-16*p.s,'#263e59','#8294a4',Math.max(1,Math.round(3*p.s)));
   if(p.s>.23)label('→ 第二關',p.cx,99,Math.max(8,Math.round(14*p.s)),'#f9d6a2');
 }
 // The camera follows behind the playable character. Do not move sprite up the screen.
 box(211,242,58,8,'#10182c99');drawChar(chars[game.selected],240,222+Math.sin(game.walk*11)*1.2,2.15,'up',game.walk);

}
function drawMarket(time){let i=game.quiz;let palettes=[['#324b5c','#526f64','#bf8e68'],['#313d62','#797d73','#dba76a'],['#42405c','#6b5862','#c6a27a'],['#344e5b','#698270','#e5b57c'],['#28415d','#567b8e','#c8a0aa']][i]||['#324b5c','#526f64','#bf8e68'];box(0,0,480,270,palettes[0]);for(let j=0;j<9;j++)box(0,j*15,480,2,'#81909a16');box(0,158,480,112,palettes[1]);for(let y=160;y<270;y+=27){box(0,y,480,3,'#243b49');for(let x=y%2?5:27;x<480;x+=42)box(x,y+3,3,25,'#455e67')}
 for(let n=0;n<3;n++){let x=26+n*156;box(x+5,86,122,84,'#4a4b58');box(x,79,132,19,palettes[2]);for(let z=0;z<6;z++)box(x+z*22,79,12,21,z%2?'#ead49f':'#8f5258');box(x+9,100,114,65,'#6d6b6d');box(x+12,103,108,41,'#3a4656');for(let b=0;b<3;b++){if(i%2===0)drawCoin(x+31+b*25,123,8);else drawBanknote(x+20+b*24,115,22,13,(i+1)%5)}box(x+5,146,122,22,'#987b64')}
 box(225,209,30,9,'#131d30bb');drawChar(chars[game.selected],240,197,1.7,'down',game.walk,game.mode==='dead');
 for(let j=0;j<5;j++){const x=139+j*45;box(x,19,29,28,j===i?'#f6d18a':'#263d54');label(String(j+1),x+14,33,12,j===i?'#202b43':'#c9d5df')}
}
function setHUD(){
 const modes={select:['選擇角色','CHOOSE YOUR CHICKEN'],outside:['博物館入口','WALK INTO THE MUSEUM'],title:['展覽序章','PRESS F TO CONTINUE'],hall:['第一關 · 歷史長廊','CHAPTER 01 / GALLERY'],chapter2Intro:['第二關 · 雞蛋購買力','PRESS F TO START'],market:['第二關 · 雞蛋購買力','CHAPTER 02 / EGG QUIZ'],marketSuccess:['答對了！','CHALLENGE CLEARED'],dead:['GAME OVER','RESTART CHAPTER 02'],finish:['策展理念','EXHIBITION COMPLETE']};
 const h=modes[game.mode]||modes.select;
 $('#levelName').textContent=h[0];$('#levelSubtitle').textContent=h[1];
 let score=['market','marketSuccess','dead','chapter2Intro'].includes(game.mode)?game.quizWins:game.mode==='finish'?5:game.seen.filter(Boolean).length;
 $('#progressText').textContent=['market','marketSuccess','dead','chapter2Intro'].includes(game.mode)?'答對題數 '+score+' / 5':'展品進度 '+score+' / 5';$('#progressFill').style.width= Math.min(100,score/5*100)+'%';
 hint.textContent=game.mode==='outside'?'WASD / 方向鍵：朝博物館大門前進':game.mode==='hall'?(nearExhibitIndex()>=0?'按 F 查看牆上的文物':'W / ↑ 向前走，靠近牆上展品按 F'):game.mode==='market'?'1／2／3 作答 · 答錯從第 1 題重來':game.mode==='select'?'選擇公雞、母雞或小雞':game.mode==='dead'?'按 R 重新挑戰第二關':'按 F 繼續';
}
function show(html,stage=''){overlay.classList.remove('hidden');overlay.classList.toggle('stage-overlay',Boolean(stage));if(stage)overlay.dataset.stage=stage;else delete overlay.dataset.stage;overlay.innerHTML=`<article class="panel">${html}</article>`;requestAnimationFrame(()=>{const first=overlay.querySelector('button');if(first)first.focus({preventScroll:true})})}
function hide(){overlay.classList.add('hidden');overlay.classList.remove('stage-overlay');delete overlay.dataset.stage;overlay.innerHTML=''}
function chooseChar(i){game.selected=i;renderSelect()}
function renderSelect(){game.mode='select';setHUD();show(`<div class="eyebrow">CHOOSE YOUR CHARACTER / 角色選擇</div><h1 class="display">選一隻<span class="accent">小雞夥伴</span></h1><p class="intro">公雞、母雞、小雞，誰要帶你穿越臺灣貨幣的五個時代？</p><div class="avatars">${chars.map((c,i)=>`<button class="avatar ${i===game.selected?'selected':''}" data-char="${i}"><canvas class="avatar-preview" width="74" height="85" data-preview="${i}"></canvas><strong>${c.name}</strong><span>${c.role}</span></button>`).join('')}</div><div class="actions"><button class="button" data-action="start">開始冒險 ▶</button><span class="secondary">1–3 選角色 · Enter 開始</span></div>`);
 overlay.querySelectorAll('canvas[data-preview]').forEach(cv=>{const i=Number(cv.dataset.preview),p=cv.getContext('2d');p.imageSmoothingEnabled=false;p.fillStyle='#293a56';p.fillRect(0,0,74,85);for(let j=0;j<7;j++){p.fillStyle=j%2?'#354964':'#2a3d56';p.fillRect(0,j*12,74,2)};p.fillStyle='#101726';p.fillRect(13,74,48,5);drawChicken(p,chars[i],37,66,2,'down',0)});
}
function startGame(){game.x=240;game.y=238;game.walk=0;game.mode='outside';game.prog=0;game.openExhibit=-1;game.seen=Array(5).fill(false);game.quiz=0;game.quizWins=0;held.clear();hide();beep(670,.1);setHUD()}
function showTitle(){game.mode='title';setHUD();show(`<div class="eyebrow">WELCOME TO THE MUSEUM / 序章</div><h1 class="display">《從清末到現代》<br><span class="accent">臺灣貨幣的演變</span></h1><p class="intro">在漫長的歷史長廊裡，觀察五件真實館藏，看見貨幣如何隨政權、經濟與人民生活而改變。</p><div class="actions"><button class="button" data-action="continue">按 F · 進入第一關 ▶</button><span class="secondary">CHAPTER 01 · 歷史長廊</span></div>`);beep(700,.15)}
function imgHTML(e,cl='museum-photo'){const i=exhibits.indexOf(e);return `<div class="photo-stage"><canvas class="artifact-preview" width="176" height="96" data-artwork="${i}" aria-label="文物像素示意圖"></canvas><span class="preview-label">像素示意圖 · 官方照片載入中</span><img class="${cl}" src="${e.image}" alt="${e.name}：${e.museum}館藏實物照片" loading="eager"><div class="photo-error" hidden>官方照片無法載入；目前為像素示意圖。<br><a href="${e.link}" target="_blank" rel="noopener noreferrer">查看真正的官方館藏照片 ↗</a></div></div>`}
function watchImages(){overlay.querySelectorAll('.photo-stage').forEach(stage=>{
 const cv=stage.querySelector('.artifact-preview'),i=Number(cv.dataset.artwork),img=stage.querySelector('img'),cap=stage.querySelector('.preview-label');
 artifactCanvas(cv,i);
 const loaded=()=>{stage.classList.add('photo-loaded');cap.hidden=true};
 const failed=()=>{img.hidden=true;cap.textContent='像素示意圖';const fallback=stage.querySelector('.photo-error');if(fallback)fallback.hidden=false};
 img.addEventListener('load',loaded,{once:true});img.addEventListener('error',failed,{once:true});
 if(img.complete){if(img.naturalWidth)loaded();else failed()}
 })}
function showExhibit(i){game.openExhibit=i;const e=exhibits[i];show(`<div class="eyebrow">EXHIBIT 0${i+1} / 05 · ${e.era}</div><h2 class="card-title">${e.name}</h2><div class="artifact-layout"><div class="artifact-box real-artifact">${imgHTML(e)}<small>典藏來源：${e.museum}</small></div><div class="artifact-text"><div class="meta">▣ ${e.period}　▣ ${e.type}<br>典藏：${e.museum}　編號 ${e.code}</div><div class="description"><strong>當時的社會背景</strong><p>${e.social}</p><strong>文物外觀與細節</strong><p>${e.detail}</p><strong>歷史意義</strong><p>${e.meaning}</p></div><div class="source">圖片及資料：${e.museum}<br><span>${e.license}</span><br><a href="${e.link}" target="_blank" rel="noopener noreferrer">開啟官方典藏紀錄與原始照片 ↗</a></div></div></div><div class="actions"><button class="button" data-action="continue">按 F · 繼續向前 ▶</button><span class="secondary">第 ${i+1} / 5 件館藏</span></div>`);watchImages();beep(720+i*60,.13)}
function enterHall(){game.mode='hall';game.prog=0;game.x=240;game.openExhibit=-1;game.seen=Array(5).fill(false);hide();setHUD();beep(560,.12)}
function showChapter2Intro(){game.mode='chapter2Intro';setHUD();show(`<div class="eyebrow">CHAPTER 02</div><h1 class="display">第二關<br><span class="accent">雞蛋購買力挑戰</span></h1><p class="intro">你已看完五件歷史貨幣。接下來請依序猜猜看：<strong>一枚或一張代表貨幣，在指定年代大約能買幾顆雞蛋？</strong></p><div class="chapter-rules"><div>🥚 <strong>五件展品 · 五道選擇題</strong></div><div>① 每題都有 <strong>3 個雞蛋數量選項</strong></div><div>② <strong>任一題答錯，角色死亡，從第二關第 1 題重來</strong></div></div><div class="actions"><button class="button" data-action="continue">按 F · 開始挑戰 ▶</button><span class="secondary">準備好了嗎？</span></div>`,'intro');beep(910,.16)}
function enterMarket(){game.quiz=0;game.quizWins=0;showQuestion()}
function showQuestion(){game.mode='market';const i=game.quiz,q=questions[i],e=exhibits[i];setHUD();show(`<div class="eyebrow">CHAPTER 02 · 第 ${i+1} / 5 小關</div><div class="big-number">比較年代：${q.compare}</div><h2 class="question">「${e.short}」在指定年代約能買幾顆雞蛋？</h2><div class="quiz-layout"><div class="quiz-photo">${imgHTML(e)}<small>典藏來源：${e.museum}</small></div><div class="quiz-body"><div class="egg-question">🥚 🥚 🥚 <span>猜猜看！</span></div><div class="choices">${q.options.map((v,j)=>`<button class="choice" data-answer="${j}"><em>${j+1}</em><span>${v} 顆雞蛋</span></button>`).join('')}</div></div></div><div class="note">可按鍵盤 1、2、3，或直接點選答案。</div>`,'quiz');watchImages()}
function answerQuestion(chosen){if(game.mode!=='market'||overlay.classList.contains('hidden'))return;const q=questions[game.quiz];if(chosen===q.correct){game.quizWins=game.quiz+1;game.mode='marketSuccess';setHUD();beep(850,.11);show(`<div class="eyebrow">CORRECT ANSWER · ${game.quiz+1} / 5</div><h2 class="display" style="color:#92f1cd">答對了！ ✓</h2><p class="intro">${q.why}</p><div class="answer-eggs">🥚 <strong>${q.options[q.correct]} 顆雞蛋</strong></div><div class="actions"><button class="button" data-action="continue">按 F · ${game.quiz===4?'進入策展理念':'下一題'} ▶</button><span class="secondary">已成功通過 ${game.quizWins} / 5 題</span></div>`,'success')}else{game.mode='dead';game.death=performance.now();setHUD();beep(170,.22,'sawtooth',.055);show(`<div class="wrong"><div class="eyebrow" style="color:#ff99aa">YOU DIED · 時空挑戰失敗</div><div class="skull" aria-hidden="true">💀</div><h2 class="display" style="color:#ff9daa">GAME OVER</h2><p class="intro">正確答案是 <strong style="color:#ffe3a1">${q.options[q.correct]} 顆雞蛋</strong>。<br>${q.why}</p><p class="health">♥ → ×</p><div class="actions" style="justify-content:center"><button class="button" data-action="restartQuiz">按 R · 從第二關第 1 題重來</button></div><p class="secondary">第一關的文物不必重新參觀</p></div>`,'fail')} }
function continueGame(){if(game.mode==='title'){enterHall();return}
 if(game.mode==='hall'&&!overlay.classList.contains('hidden')){if(game.openExhibit>=0){game.seen[game.openExhibit]=true;game.openExhibit=-1}hide();setHUD();return}
 if(game.mode==='hall'&&overlay.classList.contains('hidden')){let i=nearExhibitIndex();if(i>=0)showExhibit(i);return}
 if(game.mode==='chapter2Intro'){enterMarket();return}
 if(game.mode==='marketSuccess'){game.quiz++;if(game.quiz>=5)finish();else showQuestion();return}
 if(game.mode==='dead'){restartQuiz();return}
 if(game.mode==='finish'){startGame();return}
}
function restartQuiz(){game.quiz=0;game.quizWins=0;showQuestion()}
function finish(){game.mode='finish';setHUD();beep(970,.15);show(`<div class="eyebrow">EXHIBITION COMPLETE / 策展理念</div><h2 class="display">恭喜通關！<br><span class="accent">貨幣不只是數字</span></h2><p class="intro">你跟著五件真實館藏，走過清末、日治、戰後、新臺幣改革及現代社會，也體驗了不同年代貨幣購買力的差異。</p><div class="end-cols"><div class="end-col"><strong>01｜貨幣與權力</strong><p>銀幣上的「臺灣製造」、日治銀行券的圖紋，都見證政權與貨幣發行制度的變遷。</p></div><div class="end-col"><strong>02｜貨幣與生活</strong><p>1940 年代末的通膨提醒我們：面額增加，未必代表生活更富裕；重要的是購買力。</p></div><div class="end-col"><strong>03｜貨幣與記憶</strong><p>新臺幣與紀念性塑膠鈔券，記錄臺灣經濟、社會和印製科技的變化。</p></div></div><div class="actions"><button class="button" data-action="restartAll">重新參觀 ↺</button><span class="secondary">感謝參觀《從清末到現代——臺灣貨幣的演變》</span></div>`,'finish')}
function update(dt){
 if(game.mode==='outside'&&overlay.classList.contains('hidden')){
  let dx=(held.has('d')?1:0)-(held.has('a')?1:0),dy=(held.has('s')?1:0)-(held.has('w')?1:0);
  if(dx||dy){const l=Math.hypot(dx,dy);game.x=Math.min(390,Math.max(88,game.x+dx/l*100*dt));game.y=Math.min(256,Math.max(155,game.y+dy/l*100*dt));game.walk+=dt*4}
  if(game.y<=174&&game.x>=194&&game.x<=286)showTitle();
 }else if(game.mode==='hall'&&overlay.classList.contains('hidden')){
  let dx=(held.has('d')?1:0)-(held.has('a')?1:0),dy=(held.has('w')?1:0)-(held.has('s')?1:0);
  if(dx||dy){game.x=Math.min(333,Math.max(147,game.x+dx*95*dt));
   const next=game.seen.findIndex(v=>!v);const limit=next<0?corridorEnd:milestones[next];
   game.prog=Math.min(limit,Math.max(0,game.prog+dy*215*dt));game.walk+=dt*5;}
  const near=nearExhibitIndex();const h=near>=0?'按 F 查看牆上第 '+(near+1)+' 件展品':'W / ↑ 向前走 · 靠近展品按 F';if(hint.textContent!==h)hint.textContent=h;
  if(game.prog>=corridorEnd&&game.seen.every(Boolean))showChapter2Intro();
 }
}
function render(time){if(game.mode==='select'||game.mode==='outside')drawOutside(time);else if(game.mode==='title')drawInterior();else if(game.mode==='hall')drawHall();else drawMarket(time)}
function frame(time){const dt=Math.min(.045,(time-game.ts)/1000||0);game.ts=time;update(dt);render(time);requestAnimationFrame(frame)}
function doKey(k){
 if(game.mode==='select'){if(['1','2','3'].includes(k))chooseChar(Number(k)-1);else if(k==='enter')startGame();return}
 if(game.mode==='market'&&['1','2','3'].includes(k)){answerQuestion(Number(k)-1);return}
 if(game.mode==='dead'&&k==='r'){restartQuiz();return}
 if(k==='f'||k==='enter'){continueGame();return}
 if(game.mode==='finish'&&k==='r'){startGame();return}
}
window.addEventListener('keydown',e=>{let k=e.key.toLowerCase();const keyMap={arrowup:'w',arrowdown:'s',arrowleft:'a',arrowright:'d'};k=keyMap[k]||k;if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' ','f','r','1','2','3'].includes(k))e.preventDefault();held.add(k);if(!e.repeat)doKey(k)});
window.addEventListener('keyup',e=>{let k=e.key.toLowerCase();k={arrowup:'w',arrowdown:'s',arrowleft:'a',arrowright:'d'}[k]||k;held.delete(k)});
window.addEventListener('blur',()=>held.clear());
document.addEventListener('click',e=>{const c=e.target.closest('[data-char]');if(c){chooseChar(Number(c.dataset.char));beep(460,.07);return}const a=e.target.closest('[data-answer]');if(a){answerQuestion(Number(a.dataset.answer));return}const act=e.target.closest('[data-action]');if(act){let name=act.dataset.action;if(name==='start')startGame();if(name==='continue')continueGame();if(name==='restartQuiz')restartQuiz();if(name==='restartAll')startGame()}});
const fullscreenBtn=document.getElementById('fullscreenButton');
fullscreenBtn.addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){/* browser may deny */}});
document.addEventListener('fullscreenchange',()=>{fullscreenBtn.textContent=document.fullscreenElement?'⛶ 離開全螢幕':'⛶ 全螢幕'});
document.querySelectorAll('button[data-key]').forEach(button=>{const k=button.dataset.key;const down=e=>{e.preventDefault();held.add(k);button.setPointerCapture?.(e.pointerId)};const up=e=>{e.preventDefault();held.delete(k)};button.addEventListener('pointerdown',down);button.addEventListener('pointerup',up);button.addEventListener('pointercancel',up);button.addEventListener('lostpointercapture',up)});
renderSelect();requestAnimationFrame(frame);
})();
</script>
